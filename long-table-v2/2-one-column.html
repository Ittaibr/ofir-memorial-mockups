<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#FAF7F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#191614" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex">
<title>אופיר · עמוד אחד שקט</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Frank+Ruhl+Libre:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="table.css">
<style>
/* 2 · One quiet column: warm paper, one rosewood accent for the action and the chosen filter. Nothing is boxed. */
:root { --bg: #FAF7F2; --surface: #FFFDFA; --ink: #2B2622; --muted: #6E655D; --line: #E8E1D7; --accent: #8E4F3D; --accent-soft: #F3E8E1; --on-accent: #FFFFFF; --col: 640px; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #191614; --surface: #221E1B; --ink: #EEE8E0; --muted: #A89E94; --line: #3A332E; --accent: #E0A48F; --accent-soft: #33261F; --on-accent: #191614; } }

.col { max-inline-size: calc(var(--col) + 2 * var(--gutter)); margin-inline: auto; padding-inline: var(--gutter); }
.open { display: grid; justify-items: center; text-align: center; padding-block: 72px 40px; }
.years { margin: 0 0 14px; color: var(--muted); font-size: 1rem; letter-spacing: .02em; }
.open h1 { margin: 0; font: 500 clamp(3rem, 14vw, 5rem)/1 var(--font-serif); }
.roles { margin: 16px 0 0; color: var(--muted); font-size: 1.0625rem; }
.open .print { inline-size: min(78vw, 360px); margin-block-start: 48px; }
.open .src { margin-block-start: 14px; }
.bio { margin: 48px 0 0; max-inline-size: 30ch; font: 400 1.375rem/1.85 var(--font-serif); }
.open .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 20px; margin-block-start: 36px; }
.rule { inline-size: 48px; block-size: 1px; background: var(--line); margin: 72px auto 0; border: 0; }

.fbar { border-block-start: 1px solid var(--line); }
.fbar .wrap { max-inline-size: calc(var(--col) + 2 * var(--gutter)); justify-content: center; }
@media (max-width: 640px) { .fbtns { inline-size: 100%; justify-content: space-between; } }

/* the table stays one column at every width; a highlighted photo steps out to the wide measure */
.table { max-inline-size: var(--col); margin-inline: auto; grid-template-columns: minmax(0, 1fr) !important; row-gap: 88px; }
.entry, .entry.prints.a, .entry.prints.b, .entry.words.a, .entry.words.b, .entry.chapter, .slotwrap { grid-column: 1 / -1 !important; }
.entry.has-text .inner { grid-template-columns: 1fr !important; }
.entry.words { text-align: center; }
.entry.words .quote { margin-inline: auto; }
.chapter { text-align: center; padding-block-start: 56px; }
.chapter p { margin-inline: auto; }
.chapter::before { content: ""; display: block; inline-size: 48px; block-size: 1px; background: var(--line); margin: 0 auto 40px; }
@media (min-width: 900px) {
  .table { row-gap: 128px; }
  .entry.prints.wide { margin-inline: calc((var(--col) - var(--wide)) / 2); }
  .entry.prints.tall .figs { max-inline-size: 420px; margin-inline: auto !important; }
  .entry.prints.b:not(.wide):not(.group) .figs { margin-inline-start: 18%; }
  .entry.prints.a:not(.wide):not(.group) .figs { margin-inline-end: 18%; }
}
.sitefoot b { display: block; color: var(--ink); font: 500 1.5rem var(--font-serif); margin-block-end: 4px; }
</style>
</head>
<body>
<div class="proof"></div>

<main id="site">
  <header class="col open">
    <p class="years"><bdi dir="ltr">19XX – 20XX</bdi></p>
    <h1>אופיר</h1>
    <p class="roles">בן · אח · נכד · חבר</p>
    <figure class="print"><span data-photo="p01" data-alt="אופיר, תמונה לדוגמה"></span></figure>
    <span class="src">תמונה ומילים מהמשפחה</span>
    <p class="bio" dir="auto">אח, חבר, בן אדם שידע להקשיב. מי שהיה איתו בחדר, הרגיש שהוא היחיד שם.</p>
    <div class="actions"><button type="button" class="pill" data-share>לשתף זיכרון</button><button type="button" class="textbtn" data-share>להשאיר מילה</button></div>
    <hr class="rule">
  </header>

  <nav class="fbar" id="fbar" aria-label="סינון השולחן"><div class="wrap"><div class="fbtns" id="fbtns"></div><div class="factive" id="factive"></div></div></nav>
  <div class="col"><section class="table" id="table" aria-label="השולחן הארוך: תמונות ומילים"></section></div>

  <footer class="sitefoot"><b>אופיר</b>המשפחה קוראת כל דבר לפני שהוא מופיע כאן.</footer>
</main>
<main id="admin" hidden></main>
<div class="dock"><button type="button" class="pill" data-share>לשתף זיכרון</button></div>

<script src="../shared/data.js"></script>
<script src="../shared/photos.js"></script>
<script src="table.js"></script>
<script>LongTable.boot({ name: 'הצעה 2 מתוך 3 · עמוד אחד שקט', hint: 'כל השולחן, לפי סדר השנים.' });</script>
</body>
</html>
