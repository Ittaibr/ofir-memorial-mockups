<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>אופיר · ספר פתוח</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Frank+Ruhl+Libre:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/tokens.css">
<style>
  body { padding-block-end: 44px; }
  .vh { position: absolute; inline-size: 1px; block-size: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .serif { font-family: var(--font-serif); }
  svg.i { inline-size: 22px; block-size: 22px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }

  /* ---------- buttons ---------- */
  .pill { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-block-size: 48px; padding-inline: 22px; border-radius: 999px; border: 1.5px solid var(--olive); background: transparent; color: var(--olive); font: 600 17px/1.2 var(--font-ui); text-decoration: none; cursor: pointer; transition: background .3s var(--ease), color .3s var(--ease); }
  .pill:hover { background: var(--olive-soft); }
  .pill.solid { background: var(--olive); color: var(--surface); }
  .pill.solid:hover { background: var(--olive); filter: brightness(1.08); }
  .pill[aria-disabled="true"], .pill:disabled { opacity: .45; cursor: default; pointer-events: none; }
  .pill.plain { border-color: transparent; color: var(--muted); }
  .pill.big { min-block-size: 64px; font-size: 20px; font-weight: 700; padding-inline: 32px; }

  /* ---------- header ---------- */
  .top { position: sticky; inset-block-start: 0; z-index: 20; background: var(--bg); border-block-end: 1px solid var(--line); }
  .top-in { max-inline-size: 1180px; margin-inline: auto; padding: 8px var(--gutter); display: flex; align-items: center; gap: 12px; }
  @media (min-width: 900px) { .top-in { padding-inline: 0; } }
  .brand { font: 500 24px/1 var(--font-serif); margin-inline-end: auto; }
  .contents { max-inline-size: 1180px; margin-inline: auto; padding-inline: var(--gutter); overflow: hidden; max-block-size: 0; transition: max-block-size .5s var(--ease); }
  @media (min-width: 900px) { .contents { padding-inline: 0; } }
  .contents.open { max-block-size: 80px; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding-block: 4px 12px; scrollbar-width: thin; }
  .chip { flex: none; min-block-size: 44px; padding-inline: 18px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font: 400 16px/1 var(--font-ui); }
  .chip[aria-current="true"] { border-color: var(--olive); background: var(--olive-soft); font-weight: 600; }

  /* ---------- the book ---------- */
  main { max-inline-size: 1180px; margin-inline: auto; padding: 20px var(--gutter) 24px; }
  @media (min-width: 900px) { main { padding-inline: 0; padding-block-start: 32px; } }
  .spread { display: grid; grid-template-columns: minmax(0, 1fr); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; box-shadow: var(--shadow-print); transition: opacity .6s var(--ease), transform .6s var(--ease); }
  @media (min-width: 900px) { .spread { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .page + .page { border-inline-start: 1px solid var(--line); } }
  .spread.out { opacity: 0; transition-duration: .25s; }
  .spread.pre { opacity: 0; transform: translateX(var(--dx, 10px)); transition: none; }
  .page { position: relative; display: flex; flex-direction: column; padding: 28px 22px 18px; min-block-size: 520px; }
  @media (min-width: 900px) { .page { padding: 48px 52px 24px; min-block-size: 700px; } }
  .page.blank { background: transparent; }
  .page.is-waiting::before { content: ""; position: absolute; inset: 10px; border: 2px dashed var(--amber); border-radius: 4px; pointer-events: none; }
  .body { flex: 1; display: flex; flex-direction: column; gap: 20px; }
  .body.center { justify-content: center; }
  .foot { display: flex; justify-content: space-between; align-items: center; padding-block-start: 22px; font-size: 14px; color: var(--muted); }
  .page[data-side="left"] .foot { flex-direction: row-reverse; }
  .waitpill { align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; border-radius: 999px; background: var(--amber-soft); color: var(--ink); font-size: 15px; font-weight: 600; }
  .waitpill svg { color: var(--amber); inline-size: 18px; block-size: 18px; }

  /* prints */
  .print { margin: 0 auto; inline-size: min(100%, calc(var(--h, min(42vh, 400px)) * var(--r))); }
  .mat { background: #fff; padding: 6px; border: 1px solid var(--line); box-shadow: var(--shadow-print); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .mat { background: var(--surface); } }
  .mat img { inline-size: 100%; block-size: auto; }
  .print figcaption { display: flex; flex-direction: column; gap: 2px; margin-block-start: 8px; font-size: 14px; line-height: 1.45; color: var(--muted); }
  .print .cap { color: var(--ink); font-family: var(--font-serif); font-size: 16px; }
  .wide .print { --h: min(60vh, 600px); }
  .pair-row { display: flex; gap: 14px; align-items: flex-start; }
  .pair-row .print { flex: var(--r) 1 0; inline-size: auto; min-inline-size: 0; margin: 0; }
  .extras { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
  .extras .print { --h: 96px; margin: 0; }
  .masonry { column-count: 2; column-gap: 14px; }
  .masonry .print { inline-size: 100%; break-inside: avoid; margin: 0 0 14px; }
  .fade-in { animation: fin .7s var(--ease) both; }
  @keyframes fin { from { opacity: 0; } to { opacity: 1; } }

  /* words */
  .quote { margin: 0; font: 400 clamp(20px, 2.1vw, 24px)/1.7 var(--font-serif); max-inline-size: 30em; text-wrap: pretty; }
  .words .quote { font-size: clamp(26px, 3vw, 34px); line-height: 1.55; }
  .attr { margin: 0; font-size: 16px; color: var(--muted); }
  .attr b { color: var(--olive); font-weight: 600; }

  /* cover + story */
  .cover .print { --h: min(46vh, 440px); }
  .cover h1 { margin: 0; font: 500 clamp(52px, 8vw, 84px)/1.05 var(--font-serif); }
  .dates { color: var(--muted); font-size: 18px; }
  .bio { margin: 0; font-size: 18px; max-inline-size: 26em; }
  .story h2, .compose h2, .thanks h2 { margin: 0; font: 500 clamp(30px, 3.4vw, 38px)/1.2 var(--font-serif); }
  .chap-list { list-style: none; margin: 0; padding: 0; }
  .chap-list li { padding-block: 20px; border-block-end: 1px solid var(--line); }
  .chap-list li:last-child { border: 0; }
  .chap-list h3 { margin: 0 0 4px; font: 500 22px/1.3 var(--font-serif); }
  .chap-list h3 bdi { color: var(--muted); font-family: var(--font-ui); font-size: 16px; margin-inline-start: 8px; }
  .chap-list p { margin: 0; font-size: 17px; }

  /* composer */
  .compose .lede { margin: 0; color: var(--muted); font-size: 18px; max-inline-size: 28em; }
  .drop { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; min-block-size: 190px; padding: 24px; border: 2px dashed var(--olive); border-radius: 12px; background: var(--olive-soft); color: var(--ink); text-align: center; cursor: pointer; transition: background .3s var(--ease); }
  .drop:hover { background: var(--bg); }
  .drop svg { inline-size: 40px; block-size: 40px; color: var(--olive); }
  .drop b { font: 700 22px/1.2 var(--font-ui); color: var(--olive); }
  .drop span { font-size: 16px; color: var(--muted); }
  .ptools { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: center; margin-block-start: 6px; }
  .link { background: none; border: 0; min-block-size: 48px; padding-inline: 8px; color: var(--muted); text-decoration: underline; text-underline-offset: 4px; font-size: 16px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field > label { font-weight: 600; font-size: 16px; }
  .field > label small { font-weight: 400; color: var(--muted); font-size: 15px; }
  .name-in, .words-in { inline-size: 100%; border: 0; border-block-end: 1.5px dashed var(--muted); background: transparent; color: var(--ink); padding: 8px 2px; border-radius: 0; }
  .name-in { font: 500 22px/1.4 var(--font-serif); min-block-size: 48px; }
  .words-in { font: 400 21px/1.7 var(--font-serif); min-block-size: 140px; resize: vertical; }
  .name-in:focus, .words-in:focus { outline: none; border-block-end: 2px solid var(--olive); }
  .name-in::placeholder, .words-in::placeholder { color: var(--muted); opacity: 1; }
  [aria-invalid="true"] { border-block-end-color: var(--amber) !important; }
  .err { margin: 0; color: var(--ink); font-size: 16px; display: none; background: var(--amber-soft); padding: 8px 14px; border-radius: 10px; }
  .err.on { display: block; }
  .note { margin: 0; padding: 12px 16px; border-radius: 10px; background: var(--amber-soft); color: var(--ink); font-size: 16px; }
  .compose .pill.big { align-self: stretch; }
  @media (min-width: 900px) { .compose .pill.big { align-self: flex-start; } }
  .thanks { display: flex; flex-direction: column; gap: 16px; }
  .thanks:focus { outline: none; }
  .thanks p { margin: 0; font-size: 18px; max-inline-size: 28em; }
  .thanks .row { display: flex; flex-wrap: wrap; gap: 12px; }

  /* nav */
  .nav { position: sticky; inset-block-end: 44px; z-index: 10; display: flex; align-items: center; gap: 12px; margin-block-start: 16px; padding-block: 10px; background: var(--bg); }
  .nav .count { flex: 1; text-align: center; color: var(--muted); font-size: 16px; }
  @media (max-width: 430px) { .nav .pill { padding-inline: 14px; } .nav .count { font-size: 14px; } }

  /* ---------- design bar & toast ---------- */
  .dbar { position: fixed; inset-inline: 0; inset-block-end: 0; z-index: 50; block-size: 44px; display: flex; align-items: center; justify-content: center; gap: 4px; background: var(--chat-bg); border-block-start: 1px solid var(--line); font-size: 13px; color: var(--muted); }
  .dbar button { min-block-size: 32px; padding-inline: 14px; border-radius: 999px; border: 1px solid transparent; background: transparent; font-size: 14px; color: var(--muted); }
  .dbar button[aria-pressed="true"] { border-color: var(--muted); color: var(--ink); background: var(--surface); }
  .dbar .sep { inline-size: 1px; block-size: 18px; background: var(--line); margin-inline: 6px; }
  .toast { position: fixed; inset-inline: 16px; inset-block-end: 60px; z-index: 60; max-inline-size: 460px; margin-inline: auto; display: none; align-items: center; gap: 14px; padding: 14px 14px 16px 14px; padding-inline-start: 20px; border-radius: 12px; background: var(--ink); color: var(--bg); font-size: 18px; overflow: hidden; }
  .toast.on { display: flex; animation: fin .5s var(--ease) both; }
  .toast span { flex: 1; }
  .toast button { min-block-size: 48px; padding-inline: 22px; border-radius: 999px; border: 1.5px solid var(--bg); background: transparent; color: var(--bg); font: 700 18px/1 var(--font-ui); }
  .toast i { position: absolute; inset-inline: 0; inset-block-end: 0; block-size: 3px; background: var(--bg); opacity: .6; transform-origin: right; animation: run 5s linear forwards; }
  @keyframes run { from { transform: scaleX(1); } to { transform: scaleX(0); } }

  /* ---------- admin ---------- */
  #admin { max-inline-size: 1120px; margin-inline: auto; padding: 24px var(--gutter) 48px; }
  @media (min-width: 900px) { #admin { padding-inline: 0; } }
  .a-title { margin: 0 0 16px; font: 500 34px/1.2 var(--font-serif); }
  .tabs { display: flex; gap: 10px; margin-block-end: 28px; flex-wrap: wrap; }
  .tabs .pill { font-size: 18px; min-block-size: 56px; }
  .tabs .pill[aria-pressed="true"] { background: var(--olive); color: var(--surface); }
  .ed { display: grid; gap: 28px; grid-template-columns: minmax(0, 1fr); }
  .ed > * { min-inline-size: 0; }
  @media (min-width: 900px) {
    .ed { grid-template-columns: minmax(0, 500px) minmax(0, 1fr); column-gap: 64px; grid-template-areas: "sum prev" "tpl prev" "dec prev"; align-items: start; }
    .ed .sum { grid-area: sum; } .ed .tpl { grid-area: tpl; } .ed .dec { grid-area: dec; }
    .ed .pv { grid-area: prev; position: sticky; inset-block-start: 84px; }
  }
  .ed h2 { margin: 0 0 6px; font: 500 28px/1.3 var(--font-serif); }
  .ed h2:focus { outline: none; }
  .meta { margin: 0 0 14px; color: var(--muted); font-size: 18px; }
  .sum .thumbs { display: flex; flex-wrap: wrap; gap: 12px; margin-block-end: 14px; }
  .sum .thumbs .print { --h: 120px; margin: 0; }
  .sum .words-t { margin: 0; font-size: 20px; line-height: 1.6; max-inline-size: 30em; }
  .tpl h3, .pv h3 { margin: 0 0 12px; font: 700 20px/1.3 var(--font-ui); }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .tile { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 8px; min-block-size: 168px; padding: 12px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface); cursor: pointer; text-align: center; }
  .tile svg { inline-size: 72px; block-size: 90px; fill: none; stroke: var(--muted); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .tile b { font-size: 19px; font-weight: 700; }
  .tile small { color: var(--muted); font-size: 15px; min-block-size: 20px; }
  .tile:has(input:checked) { border: 2px solid var(--olive); background: var(--olive-soft); }
  .tile:has(input:checked) svg { stroke: var(--olive); }
  .tile:has(input:focus-visible) { outline: 3px solid var(--olive); outline-offset: 3px; }
  .tile:has(input:disabled) { opacity: .55; cursor: default; }
  .tile input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: inherit; }
  .dec { display: flex; flex-direction: column; gap: 12px; }
  @media (min-width: 560px) { .dec.two { flex-direction: row; flex-wrap: wrap; } .dec.two .big { flex: 1 1 200px; } }
  .pvframe { background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-print); }
  .pvframe .page { min-block-size: 480px; padding: 28px 24px 16px; }
  .pv p.cap2 { margin: 10px 0 0; color: var(--muted); font-size: 16px; }
  .rows { list-style: none; margin: 0; padding: 0; }
  .rows li { display: flex; align-items: center; gap: 16px; padding-block: 16px; border-block-end: 1px solid var(--line); }
  .rows .th { flex: none; inline-size: 88px; display: flex; justify-content: center; }
  .rows .th .print { --h: 64px; margin: 0; }
  .rows .th .print .mat { padding: 3px; }
  .rows .tx { flex: 1; min-inline-size: 0; font-size: 18px; }
  .rows .tx b { display: block; }
  .rows .tx span { display: block; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rows .pill { font-size: 17px; }
  @media (max-width: 520px) { .rows li { flex-wrap: wrap; } .rows .pill { inline-size: 100%; } }
  .empty { font: 400 24px/1.6 var(--font-serif); max-inline-size: 24em; }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="M14 6l-6 6 6 6"/></symbol>
  <symbol id="i-prev" viewBox="0 0 24 24"><path d="M10 6l6 6-6 6"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
  <symbol id="i-img" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="1.5"/><circle cx="9" cy="10" r="1.6"/><path d="M4 17l5-4.5 3.5 3 3-2.5 4.5 4"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h9"/></symbol>
</svg>

<header class="top" id="top">
  <div class="top-in">
    <span class="brand">אופיר</span>
    <button class="pill" id="tocBtn" type="button" aria-expanded="false" aria-controls="toc"><svg class="i"><use href="#i-list"/></svg>תוכן</button>
    <button class="pill solid" type="button" data-act="compose"><svg class="i"><use href="#i-plus"/></svg>להוסיף דף</button>
  </div>
  <nav class="contents" id="toc" aria-label="תוכן הספר"><div class="chips" id="chips"></div></nav>
</header>

<div id="site">
  <main>
    <div class="spread" id="spread" aria-live="off"></div>
    <div class="nav" id="nav">
      <button class="pill" type="button" data-act="prev" id="prevBtn"><svg class="i"><use href="#i-prev"/></svg>לדף הקודם</button>
      <div class="count" id="count"></div>
      <button class="pill solid" type="button" data-act="next" id="nextBtn">לדף הבא<svg class="i"><use href="#i-next"/></svg></button>
    </div>
  </main>
</div>

<div id="admin" hidden></div>

<p class="vh" id="announce" role="status"></p>
<input class="vh" type="file" id="file" multiple accept="image/*" tabindex="-1">

<div class="toast" id="toast" role="status"><span id="toastMsg"></span><button type="button" id="toastUndo">לבטל</button><i></i></div>

<div class="dbar" role="group" aria-label="תצוגת עיצוב">
  <span>תצוגת עיצוב</span>
  <button type="button" data-mode="site" aria-pressed="true">אתר</button>
  <button type="button" data-mode="contribute" aria-pressed="false">תרומה</button>
  <button type="button" data-mode="admin" aria-pressed="false">ניהול</button>
  <span class="sep"></span>
  <button type="button" id="demoFill" hidden>למלא דוגמה</button>
</div>

<script src="shared/data.js"></script>
<script src="shared/photos.js"></script>
<script>
(function () {
  'use strict';
  var O = window.OFIR, C = O.copy;
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var desk = window.matchMedia('(min-width: 900px)');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
  var icon = function (n) { return '<svg class="i" aria-hidden="true"><use href="#i-' + n + '"/></svg>'; };

  /* ---------- data ---------- */
  function ph(id, name) {
    var p = O.byId(id), q = id.charAt(0) === 'q';
    return { src: p.src, ratio: p.ratio, by: name || p.by, caption: q ? '' : p.caption, alt: q ? 'תמונה שנשלחה לספר' : p.caption };
  }
  var seq = 0, qoMax = 0;
  function mk(o) { seq++; var d = { id: 'i' + seq, status: 'approved', order: seq * 10, photos: [], text: '', name: '', chapter: '', layout: 'big' }; for (var k in o) d[k] = o[k]; return d; }
  function autoLayout(photos, text) {
    var n = photos.length;
    if (!n) return 'words';
    if (n === 1) return photos[0].ratio >= 1.5 ? 'wide' : 'big';
    return n === 2 ? 'pair' : 'grid';
  }
  var M = {}; O.messages.forEach(function (m) { M[m.id] = m; });
  var items = [
    mk({ chapter: 'ילדות', layout: 'pair', photos: [ph('p07'), ph('p11')], name: 'המשפחה', text: 'בן שש, בלי נעליים. והחבר׳ה מהשכונה.' }),
    mk({ chapter: 'ילדות', layout: 'big', photos: [ph('p04')], name: M.m4.name, text: M.m4.text }),
    mk({ chapter: 'צבא', layout: 'big', photos: [ph('p05')], name: M.m5.name, text: M.m5.text }),
    mk({ chapter: 'צבא', layout: 'words', name: 'המשפחה', text: O.chapters[1].text }),
    mk({ chapter: 'דרכים', layout: 'big', photos: [ph('p02')], name: M.m1.name, text: M.m1.text }),
    mk({ chapter: 'דרכים', layout: 'wide', photos: [ph('p06')], name: M.m6.name, text: M.m6.text }),
    mk({ chapter: 'דרכים', layout: 'pair', photos: [ph('p03'), ph('p09')], name: M.m2.name, text: M.m2.text }),
    mk({ chapter: 'בית', layout: 'big', photos: [ph('p10')], name: 'המשפחה', text: '' }),
    mk({ chapter: 'בית', layout: 'words', name: M.m3.name, text: M.m3.text })
  ];
  O.queue.forEach(function (q) {
    var photos = q.photos.map(function (id) { return ph(id, q.name); });
    items.push(mk({ status: 'waiting', qo: ++qoMax, chapter: 'עוד זיכרונות', photos: photos, layout: autoLayout(photos, q.text), name: q.name, text: q.text, time: q.time }));
  });
  var orderMax = seq * 10;
  var visible = function (i) { return i.status === 'approved' || (i.status === 'waiting' && i.mine); };

  /* ---------- rendering pieces ---------- */
  function print(p, o) {
    o = o || {};
    var by = o.by !== undefined ? o.by : p.by;
    var cap = p.caption ? '<span class="cap" dir="auto">' + esc(p.caption) + '</span>' : '';
    var cr = by ? '<span class="by">צולם ע״י <bdi>' + esc(by) + '</bdi></span>' : '';
    var fc = (cap || cr || o.extra) ? '<figcaption>' + cap + cr + (o.extra || '') + '</figcaption>' : '';
    return '<figure class="print' + (o.cls ? ' ' + o.cls : '') + '" style="--r:' + p.ratio + '"><div class="mat"><img src="' + p.src + '" alt="' + esc(p.alt || p.caption || 'תמונה מהאלבום') + '" style="aspect-ratio:' + p.ratio + '"></div>' + fc + '</figure>';
  }
  function quote(it, cls) {

      else if (k === 'mine') { var P = pages(), i = P.findIndex(function (p) { return p.it && p.it.id === cs.last; }); go(i < 0 ? 0 : i, -1); }
      return;
    }
    var g = e.target.closest('[data-go]'); if (g) { go(+g.dataset.go, +g.dataset.go > cur ? 1 : -1); return; }
    var m = e.target.closest('[data-mode]'); if (m) setMode(m.dataset.mode);
  });
  $('#tocBtn').addEventListener('click', function () {
    var o = $('#toc').classList.toggle('open'); this.setAttribute('aria-expanded', o);
  });
  $('#demoFill').addEventListener('click', function () {
    var a = O.byId('p12'), b = O.byId('p03');
    cs.photos = [{ src: a.src, ratio: a.ratio, by: '', caption: '', alt: 'תמונה שבחרתם' }, { src: b.src, ratio: b.ratio, by: '', caption: '', alt: 'תמונה שבחרתם' }];
    if (!cs.name) { cs.name = 'שירה'; var n = $('#cname'); if (n) n.value = cs.name; }
    setErr('body', false); paintPhotos(true);
  });
  function syncSwitch() {
    var m = mode === 'admin' ? 'admin' : (onCompose() ? 'contribute' : 'site');
    document.querySelectorAll('[data-mode]').forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.mode === m); });
    $('#demoFill').hidden = !(m === 'contribute' && !cs.sent);
  }
  function setMode(m) {
    var was = mode;
    mode = m === 'admin' ? 'admin' : 'site';
    if (m === 'site' && was === 'site' && onCompose()) cur = 0;
    var adminOn = mode === 'admin';
    $('#site').hidden = adminOn; $('#admin').hidden = !adminOn; $('#top').hidden = adminOn;
    if (adminOn) { renderAdmin(); window.scrollTo({ top: 0 }); }
    else if (m === 'contribute') { if (onCompose()) { render(); } else { cur = pages().length - 1; render(); } window.scrollTo({ top: 0 }); }
    else render();
    syncSwitch();
  }
  render();
})();
</script>
</body>
</html>
